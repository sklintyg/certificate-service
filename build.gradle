plugins {
    alias(libs.plugins.com.diffplug.spotless)
    alias(libs.plugins.com.github.ben.manes.versions)
    alias(libs.plugins.org.sonarqube)
    alias(libs.plugins.org.springframework.boot)
}

apply from: 'gradle/configureIntygBom.gradle'

springBoot {
    mainClass = 'se.inera.intyg.certificateservice.CertificateServiceApplication'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'test-report-aggregation'

    group = 'se.inera.intyg.certificateservice'
    version = System.properties['buildVersion'] ?: '0.0.1-SNAPSHOT'

    repositories {
        mavenLocal()
        maven { url 'https://nexus.drift.inera.se/repository/it-public/' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'
    apply plugin: 'java-test-fixtures'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            licenseHeaderFile(rootProject.file('spotless.license.txt'), 'package ')
            googleJavaFormat(googleJavaFormatVersion)
            removeUnusedImports()
            forbidWildcardImports()
            formatAnnotations()
        }
    }

    configurations {
        mockitoAgent
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    compileJava {
        options.encoding = "UTF-8"
        options.compilerArgs.add("-parameters")
    }

    dependencies {
        implementation platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        annotationProcessor platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        testImplementation platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        testAnnotationProcessor platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        testFixturesImplementation platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        mockitoAgent platform("se.inera.intyg.bom:platform:${intygBomVersion}")
        mockitoAgent("org.mockito:mockito-core") { transitive = false }
    }

    test {
        jvmArgs += [
                "-javaagent:${configurations.mockitoAgent.asPath}",
                "-Xshare:off"
        ]
    }

    testing {
        suites {
            test {
                useJUnitJupiter()
            }
        }
    }

    jacocoTestReport {
        dependsOn test

        reports {
            xml.required = true
            html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        }

        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        "**/testability/**",
                        "**/integrationtest/**"
                ])
            }))
        }
    }

    pluginManager.withPlugin('org.cyclonedx.bom') {
        tasks.named('cyclonedxDirectBom').configure { t ->
            t.includeConfigs = ['^runtimeClasspath$']
        }
    }
}

reporting {
    reports {
        integrationTestAggregateTestReport(AggregateTestReport) {
            testSuiteName = 'integrationTest'
        }
    }

    subprojects.collect { subproject -> subproject.name }.each { subprojectName ->
        dependencies { testReportAggregation project(":${subprojectName}") }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "intyg-certificate-service"
        property "sonar.projectName", "intyg-certificate-service"
        property "sonar.exclusions", "**/testability/**,**/integrationtest/**"
    }
}
// This repository's own agent skills are authored once under .agents/skills/ and copied
// to the locations each tool reads. The copies are generated and gitignored, matching how
// .ai-resources syncs team resources. checkLocalSkills runs in `check`, so a stale copy
// fails the build rather than depending on every developer having run the script.
tasks.register('syncLocalSkills', Exec) {
    group = 'ai tooling'
    description = 'Generates .claude/skills and .github/agents from .agents/skills.'
    commandLine './.github/scripts/sync-local-skills.sh'
}

tasks.register('checkLocalSkills', Exec) {
    group = 'ai tooling'
    description = 'Fails if a generated skill copy is missing or out of date.'
    commandLine './.github/scripts/sync-local-skills.sh', '--check'
}

tasks.named('check') { dependsOn 'checkLocalSkills' }
